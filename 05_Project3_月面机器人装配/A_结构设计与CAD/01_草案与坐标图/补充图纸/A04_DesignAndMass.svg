<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="7" refX="4.5" refY="3.5" orient="auto-start-reverse"><path d="M9 0L0 3.5L9 7" fill="none" stroke="#23748c"/></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#a3bac2" stroke-width="1"/></pattern></defs><text x="50" y="58" font-size="29" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">A04  设计、质量属性与验证范围</text><text x="50" y="92" font-size="17" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">P3-GrooveKey-v2 | 长度 mm | 名义设计，未含制造公差 | 2026-11-03</text><line x1="40" y1="112" x2="1560" y2="112" stroke="#c7d5dc" stroke-width="1.5"/><line x1="40" y1="1030" x2="1560" y2="1030" stroke="#c7d5dc" stroke-width="1.5"/><text x="50" y="1064" font-size="16" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">A / CIVL 7023    ·    来源：实际CAD实体投影与参数；不代表动态装配或结构强度验收</text><text x="1480" y="1064" font-size="16" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">4/4</text><text x="90" y="175" font-size="23" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">几何与质量（均匀材料假设）</text><text x="110" y="218" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">CAD体积：29042.6666667 mm³</text><text x="110" y="257" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">密度ρ=2500 kg/m³：暂定建模假设，不是本组材料实测值。</text><text x="110" y="296" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">单件质量：72.606667 g；几何质心Z=10.56625310 mm。</text><text x="110" y="335" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">质心惯量Ixx/Iyy/Izz：7.55471796e-06 / 1.87062546e-05 / 2.040344e-05 kg·m²。</text><text x="110" y="374" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">对称性使非对角项理论为0；原始计算残差另存JSON。</text><text x="90" y="441" font-size="23" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">设计理由与待验证事项</text><text x="110" y="484" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">重复单件与统一接口便于制造、抓取和定位；槽向上敞开便于退出。</text><text x="110" y="523" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">顶部斜面与底部入口提供几何导向空间，尚未证明动态自纠偏。</text><text x="110" y="562" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">上下为松配合，未锁止抗拔；各列/转角无侧向连接。</text><text x="110" y="601" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">烧结收缩、粗糙度、细凸台脆弱性、制造公差尚待材料与工艺验证。</text><text x="90" y="668" font-size="23" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">本阶段检查与交接</text><text x="110" y="711" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">实际生成AutoCAD DWG实体、参数化FCStd、STEP与mm/m STL。</text><text x="110" y="750" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">单件体积/包络/闭合性、STEP重开、参数编辑重算、装配体积干涉已检查。</text><text x="110" y="789" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">C已有结果使用临时参数与接触触发辅助约束，物理过程经过检查点续跑。</text><text x="110" y="828" font-size="19" fill="#203a48" font-family="Microsoft YaHei,Arial,sans-serif">更换质量/惯量后须由B/C复测；现有数据不含实际关节力矩。</text></svg>